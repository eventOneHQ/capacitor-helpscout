name: CI
on:
  pull_request:
  push:
    branches:
      - next
      - beta
jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run eslint
      - run: npm run prettier -- --check

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run verify:android

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build
        run: xcodebuild -scheme CapacitorHelpscout -destination generic/platform=iOS -skipPackagePluginValidation build
      - name: Test
        run: xcodebuild -scheme CapacitorHelpscout -destination 'platform=iOS Simulator,name=iPhone 17' -skipPackagePluginValidation test
